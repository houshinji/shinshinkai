<!DOCTYPE html>
<html lang="ja">
<head>
	<!--2026/3/26 13:29-->
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="manifest" href="manifest.json">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>親真会 歌集</title>
	<style>
		/* 元の CSS をそのまま継承 */
		* { box-sizing: border-box; }
		:root {
			--bg-color: #121212;
			--card-bg: #1e1e1e;
			--text-main: #e0e0e0;
			--text-sub: #b0b0b0;
			--accent-color: #d4af37;
			--border-color: #443c24;
			--title-border: #333333;
		}

		body {
			font-family: "Helvetica Neue", Arial, sans-serif;
			background-color: var(--bg-color);
			color: var(--text-main);
			margin: 0;
			padding: 20px 20px 90px;
		}

		h1 {
			text-align: center;
			color: #d4af37;
			text-shadow: 2px 2px 0 var(--title-border), -2px 2px 0 var(--title-border), 2px -2px 0 var(--title-border), -2px -2px 0 var(--title-border), 0px 2px 4px rgba(0,0,0,0.5);
			margin-bottom: 40px;
			font-weight: bold;
			letter-spacing: 0.1em;
		}

		.playlist-container {
			max-width: 800px;
			margin: 0 auto;
			display: flex;
			flex-direction: column;
			gap: 30px;
		}

		.audio-card {
			background: var(--card-bg);
			padding: 20px;
			border-radius: 16px;
			box-shadow: 0 10px 25px rgba(0,0,0,0.6);
			border: 1px solid var(--border-color);
			opacity: 0;
			transform: translateY(30px);
			transition: opacity 0.8s ease-out, transform 0.8s ease-out;
		}

		.audio-card.visible { opacity: 1; transform: translateY(0); }

		.audio-title { font-weight: bold; margin-bottom: 15px; text-align: center; letter-spacing: 1px; }

		audio {
			width: 100%;
			filter: invert(85%) sepia(20%) saturate(1000%) hue-rotate(10deg);
			opacity: 0.9;
		}

		details { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; }
		summary { cursor: pointer; color: var(--accent-color); text-align: center; list-style: none; font-size: 0.9rem; font-weight: 500; }

		.lyrics-text {
			margin-top: 15px; padding: 15px; background: #252525; border-radius: 8px; font-size: 0.95rem; line-height: 1.8; color: var(--text-sub); white-space: pre-wrap; text-align: left;
		}

		#install-button-container {
			position: static; display: none; flex-direction: column; align-items: center; justify-content: center; margin-top: 40px; margin-bottom: 40px; animation: slideUp 0.3s ease-out;
		}

		@keyframes slideUp { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

		#install-btn {
			background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
			color: #000; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); transition: all 0.3s ease; max-width: 300px;
		}

		.install-description { margin-top: 10px; font-size: 0.85rem; color: var(--text-sub); text-align: center; line-height: 1.6; max-width: 300px; }

		#install-btn:disabled { opacity: 0.6; cursor: default; box-shadow: none; }

		#install-manual {
			display: none; max-width: 360px; margin: 40px auto; padding: 14px 16px;
			background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
			color: var(--text-sub); font-size: 0.85rem; line-height: 1.9; text-align: left;
		}

		.sample-menu {
			max-width: 800px;
			margin: 0 auto 30px;
			padding: 0;
			border-top: none;
			text-align: center;
		}

		.sample-menu-summary {
			display: inline-block;
			padding: 10px 28px;
			border: 1px solid var(--accent-color);
			border-radius: 999px;
			background: rgba(212, 175, 55, 0.12);
			color: var(--accent-color);
			font-size: 1rem;
			font-weight: 600;
			letter-spacing: 0.08em;
			cursor: pointer;
			list-style: none;
			transition: background 0.2s ease, transform 0.2s ease;
		}

		.sample-menu-summary::-webkit-details-marker { display: none; }
		.sample-menu-summary::after { content: " \25BE"; }
		.sample-menu[open] .sample-menu-summary::after { content: " \25B4"; }

		.sample-menu-summary:hover {
			background: rgba(212, 175, 55, 0.22);
			transform: translateY(-1px);
		}

		.sample-menu-body {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 12px;
			margin-top: 16px;
		}

		.sample-link {
			display: inline-block;
			padding: 10px 18px;
			border: 1px solid var(--accent-color);
			border-radius: 999px;
			background: rgba(212, 175, 55, 0.12);
			color: var(--accent-color);
			text-decoration: none;
			font-weight: 600;
			text-align: center;
			transition: background 0.2s ease, transform 0.2s ease;
		}

		.sample-link:hover {
			background: rgba(212, 175, 55, 0.22);
			transform: translateY(-1px);
		}

		.footer-note {
			width: 100%;
			padding: 15px 20px;
			background: rgba(18, 18, 18, 0.9);
			border-top: 1px solid var(--border-color);
			text-align: center;
			font-size: 0.85rem;
			color: var(--text-sub);
			margin-top: 40px;
		}

		@media (max-width: 600px) {
			body { padding: 20px 12px 90px; }
			.playlist-container { gap: 20px; }
			.footer-note {
				padding: 12px 14px;
				font-size: 0.78rem;
			}
		}
		.search-area { max-width: 800px; margin: 0 auto 24px; }
		/* 候補はこの枠を基準に浮かせる。下のメッセージまで含めると位置がずれるので分けてある。 */
		.search-field { position: relative; }

		.search-input {
			width: 100%;
			padding: 12px 18px;
			border: 1px solid var(--border-color);
			border-radius: 999px;
			background: var(--card-bg);
			color: var(--text-main);
			/* 16px を下回ると iOS がフォーカス時に画面を拡大してしまう */
			font-size: 1rem;
			font-family: inherit;
		}

		.search-input::placeholder { color: var(--text-sub); }

		.search-input:focus {
			outline: none;
			border-color: var(--accent-color);
			box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.25);
		}

		.search-message { margin-top: 10px; text-align: center; font-size: 0.85rem; color: var(--text-sub); }

		.search-suggestions {
			position: absolute;
			left: 0; right: 0; top: calc(100% + 6px);
			z-index: 10;
			margin: 0;
			padding: 6px 0;
			list-style: none;
			background: var(--card-bg);
			border: 1px solid var(--border-color);
			border-radius: 12px;
			box-shadow: 0 10px 25px rgba(0,0,0,0.6);
			max-height: 240px;
			overflow-y: auto;
		}

		.search-suggestion {
			padding: 10px 18px;
			cursor: pointer;
			font-size: 0.95rem;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.search-suggestion:hover, .search-suggestion.active {
			background: rgba(212, 175, 55, 0.18);
			color: var(--accent-color);
		}

		.status-message { max-width: 800px; margin: 0 auto 20px auto; text-align: center; color: var(--text-sub); font-size: 0.9rem; min-height: 1.4em; }
		.list-message { max-width: 800px; margin: 20px auto 0; text-align: center; color: var(--text-sub); font-size: 0.9rem; }
		.list-message.error { color: #ff6b6b; }

		/* 曲が並ぶまでの仮置き。実際のカードと同じ形にしておき、入れ替わっても印象が変わらないようにする */
		.playlist-placeholder { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
		/* display:flex は hidden 属性より強いので、明示的に打ち消す */
		.playlist-placeholder[hidden] { display: none; }
		.placeholder-note { text-align: center; color: var(--text-sub); font-size: 0.9rem; }

		.placeholder-card {
			background: var(--card-bg); padding: 20px; border-radius: 16px;
			border: 1px solid var(--border-color); box-shadow: 0 10px 25px rgba(0,0,0,0.6);
			display: flex; flex-direction: column; align-items: center; opacity: 0.55;
		}

		.placeholder-line { display: block; border-radius: 4px; background: #2f2f2f; }
		.placeholder-title { width: 45%; height: 1em; margin-bottom: 15px; }
		.placeholder-player { width: 100%; height: 40px; }

		@media (prefers-reduced-motion: no-preference) {
			.placeholder-line {
				background: linear-gradient(90deg, #2a2a2a 25%, #3a3a3a 50%, #2a2a2a 75%);
				background-size: 300% 100%;
				animation: placeholder-shimmer 1.6s ease-in-out infinite;
			}
			@keyframes placeholder-shimmer { from { background-position: 150% 0; } to { background-position: -150% 0; } }
		}
	</style>
</head>
<body>
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z8RN957LC9"></script>
	<script>
	window.dataLayer = window.dataLayer || [];

	gtag('js', new Date());

	gtag('config', 'G-Z8RN957LC9');

	<h1>親真会 歌集</h1>
	<div class="search-area">
		<div class="search-field">
			<input id="search-input" class="search-input" type="search" placeholder="曲名で検索"
				autocomplete="off" enterkeyhint="search" aria-label="曲名で検索"
				role="combobox" aria-controls="search-suggestions" aria-expanded="false" aria-autocomplete="list">
			<ul id="search-suggestions" class="search-suggestions" role="listbox" aria-label="検索履歴" hidden></ul>
		</div>
		<div id="search-message" class="search-message" hidden></div>
	</div>
	<details class="sample-menu">
		<summary class="sample-menu-summary">サンプル</summary>
		<div class="sample-menu-body">
			<a href="musics/家原安誠-空の向こうへ.mp4" class="sample-link" data-analytics-title="配信動画サンプル1">▶ 配信動画サンプル(通信が発生します)</a>
			<a href="musics/家原安誠-空の向こうへ2.mp4" class="sample-link" data-analytics-title="配信動画サンプル2">▶ 配信動画サンプル2(通信が発生します)</a>
		</div>
	</details>
	<div id="status-message" class="status-message"></div>
	<div id="playlist" class="playlist-container"></div>
	<!-- 最初の描画から見えるよう HTML に直接置く。JS(と外部ライブラリ)の読み込みを
	     待つ間こそ画面が空になるので、ここを JS で作ると間に合わない。
	     一覧が並んだ時点、または結果が確定した時点で JS が隠す。 -->
	<div id="playlist-placeholder" class="playlist-placeholder">
		<div class="placeholder-note">曲を読み込んでいます...</div>
		<div class="placeholder-card" aria-hidden="true"><span class="placeholder-line placeholder-title"></span><span class="placeholder-line placeholder-player"></span></div>
		<div class="placeholder-card" aria-hidden="true"><span class="placeholder-line placeholder-title"></span><span class="placeholder-line placeholder-player"></span></div>
		<div class="placeholder-card" aria-hidden="true"><span class="placeholder-line placeholder-title"></span><span class="placeholder-line placeholder-player"></span></div>
	</div>
	<div id="list-message" class="list-message" hidden></div>

	<div id="install-button-container">
		<button id="install-btn">アプリ(PWA)としてインストール</button>
		<div class="install-description">
			インストールすると、いつでもホーム画面からすぐに開けます。
		</div>
	</div>

	<div id="install-manual"></div>

	<div class="footer-note">
		一度再生した曲や表示した歌詞は保存され、通信費を使わず再生できます。
	</div>

	<script src="https://cdn.jsdelivr.net/npm/dexie@4/dist/dexie.min.js"></script>
	<script>
		let deferredPrompt = null;
		let swRegistration = null;
		let persistRequested = false;
		const activeObjectUrls = new Map();
		const cacheJobs = new Map();
		// 画面に出ている曲名 → カード要素。並べ替えのときにカードを作り直さないための対応表。
		const renderedCards = new Map();
		const SONG_LIST_STORAGE_KEY = 'shinshinkai-song-list';
		const SEARCH_HISTORY_STORAGE_KEY = 'shinshinkai-search-history';
		const SEARCH_HISTORY_LIMIT = 5;
		// 曲名を検索用に整えたもの。打つたびに整え直さないよう控えておく。
		const normalizedTitles = new Map();
		let searchHistory = [];
		let activeSuggestionIndex = -1;

		const container = document.getElementById('playlist');
		const listMessage = document.getElementById('list-message');
		const playlistPlaceholder = document.getElementById('playlist-placeholder');
		const installContainer = document.getElementById('install-button-container');
		const installBtn = document.getElementById('install-btn');
		const installManual = document.getElementById('install-manual');
		const statusMessage = document.getElementById('status-message');
		const searchInput = document.getElementById('search-input');
		const searchSuggestions = document.getElementById('search-suggestions');
		const searchMessage = document.getElementById('search-message');
		const db = window.Dexie ? new Dexie('shinshinkai-audio-db') : null;
		if (db) db.version(1).stores({ tracks: 'id,updatedAt' });

		document.querySelectorAll('.sample-link').forEach((link) => {
			link.addEventListener('click', () => {
				sendSampleVideoAnalyticsEvent(link.dataset.analyticsTitle || link.textContent.trim(), link.getAttribute('href'));
			});
		});

		function setStatus(message) { statusMessage.textContent = message || ''; }
		function getTrackPath(title) { return `musics/${encodeURIComponent(title)}.mp3`; }

		// 曲が並んだ時点、または結果が確定した時点で仮置きを下げる。
		function hidePlaylistPlaceholder() {
			if (playlistPlaceholder) playlistPlaceholder.hidden = true;
		}

		function setListMessage(message, isError) {
			listMessage.textContent = message || '';
			listMessage.classList.toggle('error', Boolean(isError));
			listMessage.hidden = !message;
		}

		// 前回表示できた曲名を控えておき、次に開いたときは通信を待たずに一覧を組み立てる。
		function readStoredSongList() {
			try {
				const stored = JSON.parse(localStorage.getItem(SONG_LIST_STORAGE_KEY) || '[]');
				return Array.isArray(stored) ? stored.filter(title => typeof title === 'string' && title) : [];
			} catch { return []; }
		}

		function storeSongList(titles) {
			try { localStorage.setItem(SONG_LIST_STORAGE_KEY, JSON.stringify(titles)); } catch {}
		}

		// 通信エラーの message はブラウザ既定の英文(Failed to fetch など)なので画面には出せない。
		// 自分で投げたものだけ userMessage を持たせて、そのまま見せてよい印にする。
		function songListError(message) {
			const error = new Error(message);
			error.userMessage = message;
			return error;
		}

		function sendAnalyticsEvent(eventName, title, audioElement, extraParameters = {}) {
			if (typeof window.gtag !== 'function') return;
			window.gtag('event', eventName, {
				song_title: title,
				song_file: getTrackPath(title),
				playback_position: Math.floor(audioElement.currentTime || 0),
				playback_duration: Number.isFinite(audioElement.duration) ? Math.floor(audioElement.duration) : 0,
				is_cached: audioElement.dataset.cached === 'true',
				...extraParameters
			});
		}

		// サンプル動画も曲と同じ song_play で送る。song_title / song_file が
		// 曲と揃うので、GA 側で 2 つのサンプルをそれぞれ判別できる。
		function sendSampleVideoAnalyticsEvent(title, href) {
			if (typeof window.gtag !== 'function') return;
			window.gtag('event', 'song_play', {
				song_title: title,
				song_file: href,
				play_type: 'sample'
			});
		}

		async function requestPersistentStorage() {
			if (persistRequested) return;
			persistRequested = true;
			try {
				if (navigator.storage?.persist) await navigator.storage.persist();
			} catch (e) { console.warn('persist request failed', e); }
		}

		function setAudioToBlob(audioElement, trackId, blob) {
			const oldUrl = activeObjectUrls.get(trackId);
			if (oldUrl) URL.revokeObjectURL(oldUrl);
			const blobUrl = URL.createObjectURL(blob);
			activeObjectUrls.set(trackId, blobUrl);

			const wasPaused = audioElement.paused;
			const currentTime = audioElement.currentTime || 0;
			audioElement.src = blobUrl;
			audioElement.dataset.cached = 'true';
			try { if (currentTime > 0) audioElement.currentTime = currentTime; } catch {}
			if (!wasPaused) {
				audioElement.dataset.suppressAnalyticsPlay = 'true';
				audioElement.play().catch(() => {
					delete audioElement.dataset.suppressAnalyticsPlay;
				});
			}
		}

		async function applyCachedTrackIfExists(title, audioElement) {
			if (!db) return;
			try {
				const trackId = getTrackPath(title);
				const saved = await db.tracks.get(trackId);
				if (saved?.blob) setAudioToBlob(audioElement, trackId, saved.blob);
			} catch (e) { console.warn('read from idb failed', e); }
		}

		async function cacheTrackInBackground(title, audioElement) {
			if (!db) return;
			const trackId = getTrackPath(title);
			if (cacheJobs.has(trackId)) return cacheJobs.get(trackId);

			const job = (async () => {
				const existing = await db.tracks.get(trackId);
				if (existing?.blob) {
					if (audioElement.dataset.cached !== 'true') setAudioToBlob(audioElement, trackId, existing.blob);
					return;
				}
				setStatus('再生中の曲を端末に保存しています...');
				try {
					const response = await fetch(trackId, { cache: 'no-store' });
					if (!response.ok) throw new Error(`download failed: ${response.status}`);
					const blob = await response.blob();
					await db.tracks.put({
						id: trackId,
						title,
						blob,
						mime: blob.type,
						size: blob.size,
						updatedAt: Date.now()
					});
					setAudioToBlob(audioElement, trackId, blob);
				} catch (e) {
					console.error('background cache failed', e);
				} finally {
					setStatus('');
				}
			})()
			.finally(() => cacheJobs.delete(trackId));

			cacheJobs.set(trackId, job);
			return job;
		}

		const observer = new IntersectionObserver((entries) => {
			entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
		}, { threshold: 0.1 });

		function parseSongList(text) { return text.split(/\r?\n/).map(line => line.trim()).filter(Boolean); }

		async function syncIndexedDbWithSongList(titles) {
			if (!db) return;
			try {
				const validTrackIds = new Set(titles.map(getTrackPath));
				await db.transaction('rw', db.tracks, async () => {
					const savedTrackIds = await db.tracks.toCollection().primaryKeys();
					const staleTrackIds = savedTrackIds.filter(trackId => !validTrackIds.has(trackId));
					if (staleTrackIds.length) await db.tracks.bulkDelete(staleTrackIds);
				});
			} catch (e) {
				console.warn('idb sync failed', e);
			}
		}

		async function loadLyrics(title, lyricsTextElement) {
			const lyricsPath = `musics/${encodeURIComponent(title)}.txt`;
			try {
				const response = await fetch(lyricsPath);
				lyricsTextElement.textContent = response.ok ? await response.text() : '歌詞ファイルが見つかりません。';
			} catch { lyricsTextElement.textContent = '歌詞を読み込めませんでした。'; }
		}

		// 全角と半角、大文字と小文字の違いで取りこぼさないよう、比べる前に形を揃える。
		function normalizeForSearch(text) {
			return text.normalize('NFKC').toLowerCase();
		}

		// 区切りは半角と全角の空白。空白の繰り返しだけなら語がひとつも取れず、全曲ヒットになる。
		function getSearchWords(rawText) {
			return normalizeForSearch(rawText).split(/[\s\u3000]+/).filter(Boolean);
		}

		// 検索対象は曲名だけ。歌詞は開いたときにしか取らないので、検索のために
		// 全曲分を取りに行くことはしない。
		function getNormalizedTitle(title) {
			let normalized = normalizedTitles.get(title);
			if (normalized === undefined) {
				normalized = normalizeForSearch(title);
				normalizedTitles.set(title, normalized);
			}
			return normalized;
		}

		function setSearchMessage(message) {
			searchMessage.textContent = message;
			searchMessage.hidden = !message;
		}

		// 語がひとつも無ければ全曲を出す。あればすべての語を含む曲だけを残す。
		function applySearchFilter() {
			const words = getSearchWords(searchInput.value);

			let hitCount = 0;
			renderedCards.forEach((card, title) => {
				const hit = !words.length || words.every(word => getNormalizedTitle(title).includes(word));
				card.hidden = !hit;
				if (hit) hitCount++;
			});

			setSearchMessage(!words.length || hitCount ? '' : '該当する曲がありません。');
		}

		function readSearchHistory() {
			try {
				const stored = JSON.parse(localStorage.getItem(SEARCH_HISTORY_STORAGE_KEY) || '[]');
				if (!Array.isArray(stored)) return [];
				return stored.filter(text => typeof text === 'string' && text.trim()).slice(0, SEARCH_HISTORY_LIMIT);
			} catch { return []; }
		}

		// 新しいものほど先頭に置く。同じ文字列は積み上げず、使うたびに先頭へ移す。
		function rememberSearchText(rawText) {
			const text = rawText.trim();
			// 空白だけの検索は全曲表示と同じで、選び直す意味がないので覚えない。
			if (!text) return;
			searchHistory = [text, ...searchHistory.filter(item => item !== text)].slice(0, SEARCH_HISTORY_LIMIT);
			try { localStorage.setItem(SEARCH_HISTORY_STORAGE_KEY, JSON.stringify(searchHistory)); } catch {}
		}

		// 入力された文字列を含む履歴だけを出す。空白の繰り返しだけなら履歴をすべて出す。
		function getSuggestions(rawText) {
			const keyword = normalizeForSearch(rawText.trim());
			if (!keyword) return searchHistory.slice();
			return searchHistory.filter(item => normalizeForSearch(item).includes(keyword));
		}

		function showSuggestions() {
			const items = getSuggestions(searchInput.value);
			searchSuggestions.textContent = '';
			activeSuggestionIndex = -1;
			items.forEach((text, index) => {
				const item = document.createElement('li');
				item.className = 'search-suggestion';
				item.id = `search-suggestion-${index}`;
				item.setAttribute('role', 'option');
				item.textContent = text;
				item.addEventListener('click', () => chooseSuggestion(text));
				searchSuggestions.appendChild(item);
			});
			searchSuggestions.hidden = items.length === 0;
			searchInput.setAttribute('aria-expanded', String(items.length > 0));
			updateActiveSuggestion();
		}

		function hideSuggestions() {
			searchSuggestions.hidden = true;
			searchSuggestions.textContent = '';
			activeSuggestionIndex = -1;
			searchInput.setAttribute('aria-expanded', 'false');
			searchInput.removeAttribute('aria-activedescendant');
		}

		function updateActiveSuggestion() {
			const items = [...searchSuggestions.children];
			items.forEach((item, index) => {
				const active = index === activeSuggestionIndex;
				item.classList.toggle('active', active);
				item.setAttribute('aria-selected', String(active));
			});
			const active = items[activeSuggestionIndex];
			if (active) {
				searchInput.setAttribute('aria-activedescendant', active.id);
				active.scrollIntoView({ block: 'nearest' });
			} else {
				searchInput.removeAttribute('aria-activedescendant');
			}
		}

		function chooseSuggestion(text) {
			searchInput.value = text;
			rememberSearchText(text);
			applySearchFilter();
			hideSuggestions();
		}

		function moveActiveSuggestion(step) {
			const count = searchSuggestions.children.length;
			if (!count) return;
			if (activeSuggestionIndex < 0) activeSuggestionIndex = step > 0 ? 0 : count - 1;
			else activeSuggestionIndex = (activeSuggestionIndex + step + count) % count;
			updateActiveSuggestion();
		}

		searchHistory = readSearchHistory();

		// 検索ボタンは置かない。語が変わったその場で結果を入れ替える。
		searchInput.addEventListener('input', () => { applySearchFilter(); showSuggestions(); });
		searchInput.addEventListener('focus', showSuggestions);
		// 候補を選んだあとも検索枠にフォーカスが残る。もう一度押しても focus は起きないので、
		// click でも開き直せるようにする。
		searchInput.addEventListener('click', showSuggestions);
		// フォーカスが外れたら候補を消す。そのとき出ていた文字列を履歴に残す。
		searchInput.addEventListener('blur', () => { rememberSearchText(searchInput.value); hideSuggestions(); });
		searchInput.addEventListener('keydown', (event) => {
			// 1 回目の Escape は候補を閉じるだけにする。ここで既定の動作まで通すと、
			// type="search" が入力を消し、その input で候補が開き直ってしまう。
			// 候補が閉じているときは既定の消去に任せる。
			if (event.key === 'Escape') {
				if (!searchSuggestions.hidden) {
					hideSuggestions();
					event.preventDefault();
				}
				return;
			}
			if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
				if (searchSuggestions.hidden) showSuggestions();
				moveActiveSuggestion(event.key === 'ArrowDown' ? 1 : -1);
				event.preventDefault();
				return;
			}
			if (event.key !== 'Enter') return;
			// 日本語入力の変換を確定する Enter は検索の確定ではない。
			if (event.isComposing || event.keyCode === 229) return;
			const active = searchSuggestions.children[activeSuggestionIndex];
			if (active) chooseSuggestion(active.textContent);
			else { rememberSearchText(searchInput.value); hideSuggestions(); }
			event.preventDefault();
		});
		// 候補を押すと先に検索枠の blur が起きる。そこで候補を消すと click が届かないので、
		// 押している間はフォーカスを移さない。
		searchSuggestions.addEventListener('pointerdown', (event) => event.preventDefault());

		function createCard(title) {
			const card = document.createElement('div');
			card.className = 'audio-card';
			card.innerHTML = `
				<div class="audio-title">${title}</div>
				<audio controls preload="none" src="musics/${encodeURIComponent(title)}.mp3"></audio>
				<details class="lyrics-details">
					<summary class="lyrics-summary">歌詞を表示する</summary>
					<div class="lyrics-text" data-loaded="false"></div>
				</details>
			`;
			const details = card.querySelector('.lyrics-details');
			const summary = card.querySelector('.lyrics-summary');
			const lyricsText = card.querySelector('.lyrics-text');
			const audio = card.querySelector('audio');
			let hasStarted = false;

			audio.addEventListener('play', () => {
				requestPersistentStorage();
				cacheTrackInBackground(title, audio);

				if (audio.dataset.suppressAnalyticsPlay === 'true') {
					delete audio.dataset.suppressAnalyticsPlay;
					return;
				}

				sendAnalyticsEvent('song_play', title, audio, {
					play_type: hasStarted ? 'resume' : 'start'
				});
				hasStarted = true;
			});
			audio.addEventListener('ended', () => {
				sendAnalyticsEvent('song_complete', title, audio);
			});
			applyCachedTrackIfExists(title, audio);

			details.addEventListener('toggle', async () => {
				summary.textContent = details.open ? '歌詞を隠す' : '歌詞を表示する';
				if (details.open && lyricsText.dataset.loaded !== 'true') {
					lyricsText.textContent = '読み込み中...';
					await loadLyrics(title, lyricsText);
					lyricsText.dataset.loaded = 'true';
				}
			});
			observer.observe(card);
			return card;
		}

		function discardCard(title) {
			const trackId = getTrackPath(title);
			const objectUrl = activeObjectUrls.get(trackId);
			if (objectUrl) {
				URL.revokeObjectURL(objectUrl);
				activeObjectUrls.delete(trackId);
			}
			renderedCards.get(title)?.remove();
			renderedCards.delete(title);
		}

		// 一覧をまるごと作り直すと高さが変わってスクロール位置が飛ぶので、
		// 既にあるカードは使い回して過不足だけを直す。並び順もその場で入れ替える。
		// カードは曲名だけで完成する(音声は preload="none")ため、通信を待つ必要がない。
		function renderSongList(titles) {
			const wanted = [];
			const seen = new Set();
			titles.forEach(title => {
				if (seen.has(title)) return;
				seen.add(title);
				wanted.push(title);
			});

			[...renderedCards.keys()].forEach(title => { if (!seen.has(title)) discardCard(title); });

			wanted.forEach((title, index) => {
				let card = renderedCards.get(title);
				if (!card) {
					card = createCard(title);
					renderedCards.set(title, card);
				}
				const atIndex = container.children[index];
				if (atIndex !== card) container.insertBefore(card, atIndex || null);
			});

			// 並べ直したカードにも今の検索を効かせる。
			applySearchFilter();

			if (wanted.length) hidePlaylistPlaceholder();
		}

		async function loadSongList() {
			try {
				// no-store: GitHub Pages は max-age を付けて返すので、ブラウザのキャッシュから
				// 古い一覧が返らないようにする。SW 側も曲リストだけは NetworkOnly にしてある。
				// ここを通った一覧だけが localStorage に入るので、控えが古くなることはあっても
				// 「通信で取れた古い一覧」が最新として保存されることはない。
				const response = await fetch('musics/index.html', { cache: 'no-store' });
				if (!response.ok) throw songListError('曲リストが見つかりません。');
				const titles = parseSongList(await response.text());
				storeSongList(titles);
				renderSongList(titles);
				setListMessage(titles.length ? '' : '曲がありません。');
				await syncIndexedDbWithSongList(titles);
			} catch (e) {
				console.error('song list load failed', e);
				// 先に並べたカードは消さない。取得できなくても前回の一覧から再生できる。
				if (renderedCards.size) {
					setListMessage('最新の曲リストを取得できませんでした。前回の一覧を表示しています。');
				} else {
					setListMessage(e.userMessage || '曲リストを取得できませんでした。通信状態をご確認ください。', true);
				}
			} finally {
				// 成否が決まったら仮置きは役目を終える。失敗時は下のメッセージが理由を伝える。
				hidePlaylistPlaceholder();
			}
		}

		async function registerServiceWorker() {
			if (!('serviceWorker' in navigator)) return;
			try {
				swRegistration = await navigator.serviceWorker.register('sw.js');
				await navigator.serviceWorker.ready;
				if (navigator.onLine) {
					const controller = navigator.serviceWorker.controller || swRegistration.active;
					if (controller) controller.postMessage({ type: 'SYNC_MUSICS' });
				}
			} catch (e) { console.error(e); }
		}

		let installCompleted = false;

		function isAppInstalled() {
			return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
		}

		// ブラウザごとの操作手順は案内しない(メニューの位置も項目名もバージョンで変わるため)。
		// ここで出すのはインストール操作の結果だけ。
		function showManualInstall(note) {
			if (installCompleted || isAppInstalled() || !note) return;
			installManual.textContent = note;
			installManual.style.display = 'block';
		}

		window.addEventListener('beforeinstallprompt', (e) => {
			e.preventDefault();
			deferredPrompt = e;
			installManual.style.display = 'none';
			installContainer.style.display = 'flex';
		});

		window.addEventListener('appinstalled', () => {
			installCompleted = true;
			deferredPrompt = null;
			installContainer.style.display = 'none';
			installManual.style.display = 'none';
		});

		installBtn.addEventListener('click', async () => {
			// prompt() は 1 つの beforeinstallprompt イベントにつき 1 回しか呼べない。
			// 先に取り出して null にし、使い回して InvalidStateError で無反応になるのを防ぐ。
			const promptEvent = deferredPrompt;
			deferredPrompt = null;
			if (!promptEvent) { showManualInstall('インストールを開始できませんでした。ページを再読み込みしてから、もう一度お試しください。'); return; }
			installBtn.disabled = true;
			try {
				await promptEvent.prompt();
				const { outcome } = await promptEvent.userChoice;
				installContainer.style.display = 'none';
				if (outcome === 'accepted') {
					installCompleted = true;
					installManual.style.display = 'none';
				} else {
					showManualInstall('インストールをキャンセルしました。ボタンからやり直す場合は、ページを再読み込みしてください。');
				}
			} catch (error) {
				console.error('PWA install failed', error);
				installContainer.style.display = 'none';
				showManualInstall('インストールを開始できませんでした。');
			} finally {
				installBtn.disabled = false;
			}
		});

		// 前回の一覧を最初の描画前に並べてしまう。ここまで通信は一切発生しないので、
		// 回線が遅くても曲名とプレーヤーはすぐ出る。取得できた最新の一覧との差分は後から反映する。
		// 控えがあればここで仮置きと入れ替わる。無ければ HTML の仮置きがそのまま残り、
		// 取得の成否が決まった時点で下がる。
		renderSongList(readStoredSongList());
		// SW の登録完了を待たずに取りに行く。登録が遅くても一覧の更新は止まらない。
		loadSongList();
		registerServiceWorker();

		window.addEventListener('online', () => { setStatus(''); loadSongList(); });
		window.addEventListener('offline', () => setStatus('オフラインで動作中です。'));
		window.addEventListener('beforeunload', () => {
			activeObjectUrls.forEach(url => URL.revokeObjectURL(url));
			activeObjectUrls.clear();
		});
	</script>
</body>
</html>
